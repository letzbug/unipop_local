<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UniPop Preview</title><link rel="stylesheet" href="assets/css/app.css"></head><body class="display-body"><main class="display-screen"><div id="noImage" class="no-image-bg"></div><img id="heroImg" class="hero-img" style="display:none"><div class="hero-overlay"></div><div class="display-logo">UniPop<span class="ldots"><i></i><i></i><i></i></span><small>Apprendre. Découvrir. Rencontrer.</small></div><section class="display-content"><div class="dkicker">COURS PRÈS DE CHEZ VOUS</div><div id="dTitle" class="dtitle"></div><div id="dSubtitle" class="dsubtitle"></div><div id="dDesc" class="ddesc"></div><div class="dmeta"><div><span class="ico">▦</span><span id="dDate"></span></div><div><span class="ico">◷</span><span id="dTime"></span></div><div><span class="ico">⌖</span><span id="dPlace"></span></div><div><span class="ico">♙</span><span id="dTrainer"></span></div><div id="dCode" class="dcode"></div></div></section><div class="avail">PLACES<br>DISPONIBLES</div><div id="qrArea" class="qr-area"><img id="qrImg"><div class="scan">Scannez-moi !</div></div><button id="printBar" class="printbar"><span class="print-icon">▣</span><span>Appuyez sur le bouton pour imprimer le flyer de ce cours</span></button></main><script src="assets/js/config.js"></script><script src="assets/js/store.js"></script><script src="assets/js/image-store.js"></script><script src="assets/js/data.js"></script><script src="assets/js/fit.js"></script><script>
(async()=>{const $=id=>document.getElementById(id),a=JSON.parse(sessionStorage.getItem('unipop_preview_assignment')||'null');let items=a?.items||[];if(!items.length){try{const c=(await UniData.loadCourses())[0];items=[{course:c,image:'',displayText:UniData.shorten(c.description,245)}]}catch(e){return}}let i=0;async function show(){const it=items[i],c=it.course;$('dTitle').textContent=c.title;$('dSubtitle').textContent=c.subtitle||c.subject||'';$('dDesc').textContent=it.displayText||'';$('dDate').textContent=c.date||'';$('dTime').textContent=c.time||'';$('dPlace').textContent=c.place||'';$('dTrainer').textContent=c.trainer||'UniPop';$('dCode').textContent='Code : '+c.code;const im=it.image||await UniImageStore.get(c.id)||'';if(im){$('heroImg').src=im;$('heroImg').style.display='block';$('noImage').style.display='none'}else{$('heroImg').style.display='none';$('noImage').style.display='block'}$('qrImg').src='https://api.qrserver.com/v1/create-qr-code/?size=500x500&margin=10&data='+encodeURIComponent(c.url||UNIPOP_CONFIG.qrFallback);$('qrArea').style.display=a?.showQR===false?'none':'block';$('printBar').style.display=a?.showPrint===false?'none':'flex';requestAnimationFrame(()=>window.UniDisplayFit&&window.UniDisplayFit())}await show();if(items.length>1)setInterval(async()=>{i=(i+1)%items.length;await show()},Math.max(5,Number(a?.duration)||14)*1000)})();
</script></body></html>
