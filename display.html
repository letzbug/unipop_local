<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>UniPop Display</title>
<script>
(function(){
  // This loader is intentionally tiny and lives inside display.html.
  // Every page load gets a fresh asset URL, so Safari/Chrome cannot reuse
  // an old display CSS/JS build after an update on GitHub Pages.
  window.UNIPOP_CACHE_TOKEN = Date.now().toString(36);
  var l=document.createElement('link');
  l.rel='stylesheet';
  l.href='assets/css/app-inject-v4.css?ucb='+window.UNIPOP_CACHE_TOKEN;
  document.head.appendChild(l);
})();
</script>
</head>
<body class="display-body">
<main class="display-screen">
  <div id="noImage" class="no-image-bg"></div>
  <img id="heroImg" class="hero-img" style="display:none" alt="">
  <div id="aiGeneratedBadge" class="ai-generated-badge" style="display:none">AI-generated</div>
  <div class="hero-overlay"></div>
  <div class="display-logo"><img src="assets/images/unipop-logo.png" alt="UniPop"></div>
  <section class="display-content">
    <div class="dkicker"></div>
    <div id="dTitle" class="dtitle"></div>
    <div id="dSubtitle" class="dsubtitle"></div>
    <div id="dDesc" class="ddesc"></div>
    <div class="dmeta">
      <div><span class="ico">▦</span><span id="dDate"></span></div>
      <div><span class="ico">◷</span><span id="dTime"></span></div>
      <div><span class="ico">⌖</span><span id="dPlace"></span></div>
      <div><span class="ico">♙</span><span id="dTrainer"></span></div>
      <div id="dCode" class="dcode"></div>
    </div>
  </section>
  <div class="avail">PLACES<br>DISPONIBLES</div>
  <div id="qrArea" class="qr-area"><img id="qrImg"><div class="scan">Scannez-moi !</div></div>
  <button id="printBar" class="printbar"><span class="print-icon" aria-hidden="true"><svg viewBox="0 0 64 64" focusable="false"><path d="M18 8h28v15H18z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><rect x="9" y="22" width="46" height="25" rx="5" fill="none" stroke="currentColor" stroke-width="4"/><path d="M18 39h28v17H18z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><circle cx="46" cy="31" r="2.5" fill="currentColor"/></svg></span><span>Appuyez sur le bouton pour imprimer le flyer de ce cours</span></button>
  <div id="toast" class="display-toast"></div>
</main>
<script>
(async function(){
  const v=window.UNIPOP_CACHE_TOKEN||Date.now().toString(36);
  const scripts=[
    'assets/js/config.js',
    'assets/js/supabase-config.js',
    'assets/js/store.js',
    'assets/js/supabase.js',
    'assets/js/hybrid-store.js',
    'assets/js/image-store.js',
    'assets/js/data.js',
    'assets/js/fit.js',
    'assets/js/inject-api.js',
    'assets/js/display-inject-v4.js'
  ];
  for(const src of scripts){
    await new Promise((resolve,reject)=>{
      const s=document.createElement('script');
      s.src=src+'?ucb='+v;
      s.onload=resolve;
      s.onerror=()=>reject(new Error('Impossible de charger '+src));
      document.body.appendChild(s);
    });
  }
})().catch(err=>console.error('UniPop loader:',err));
</script>
</body>
</html>
