<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Flyer UniPop</title><link rel="stylesheet" href="assets/css/app.css"></head><body class="flyer-body"><article class="flyer"><div class="flyer-top"><div><div class="flyer-logo">UniPop</div><div class="flyer-kicker">COURS PRÈS DE CHEZ VOUS</div></div><img id="fQr" class="flyer-qr"></div><h1 id="fTitle"></h1><h2 id="fSubtitle"></h2><div class="flyer-grid"><div><img id="fImage" class="flyer-photo"><div id="fDesc" class="flyer-desc"></div></div><div><div class="flyer-meta"><div><b>Date</b><br><span id="fDate"></span></div><div><b>Horaire</b><br><span id="fTime"></span></div><div><b>Lieu</b><br><span id="fPlace"></span></div><div><b>Formateur</b><br><span id="fTrainer"></span></div><div class="flyer-code" id="fCode"></div></div></div></div><footer class="flyer-footer"><b>UniPop</b><span>www.unipop.lu</span></footer></article><script>const p=JSON.parse(sessionStorage.getItem('unipop_print_payload')||'null');if(p){const c=p.course,$=id=>document.getElementById(id);$('fTitle').textContent=c.title||'';$('fSubtitle').textContent=c.subtitle||'';$('fDesc').textContent=c.description||p.displayText||'';$('fDate').textContent=c.date||'';$('fTime').textContent=c.time||'';$('fPlace').textContent=c.place||'';$('fTrainer').textContent=c.trainer||'UniPop';$('fCode').textContent='Code du cours : '+(c.code||'—');$('fQr').src=p.qrUrl||'';if(p.image){$('fImage').src=p.image}else{$('fImage').style.display='none'}setTimeout(()=>window.print(),600)}</script></body></html>
