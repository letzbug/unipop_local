<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>UniPop Local Display</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="display-page">
<main class="screen" aria-live="polite">
  <section class="photo-panel">
    <img id="courseImage" src="assets/images/yoga-demo.jpg" alt="">
    <div id="availability" class="availability">PLACES<br>DISPONIBLES</div>
    <footer class="brand">
      <div class="logo">UniPop<span class="logo-dots"><b></b><b></b><b></b></span></div>
      <div class="claim">Apprendre. Découvrir. Rencontrer.</div>
    </footer>
  </section>

  <section class="info-panel">
        <div class="course-content">
      <div class="kicker"><span></span>COURS PRÈS DE CHEZ VOUS</div>
      <h1 id="courseTitle">YOGA</h1>
      <h2 id="courseSubtitle">Bien-être et équilibre</h2>

      <div class="lower">
        <div class="meta">
          <div><span class="ico">Date</span><span id="courseDate">14 octobre 2026</span></div>
          <div><span class="ico clock">Heure</span><span id="courseTime">18h30 – 20h00</span></div>
          <div><span class="ico pin">Lieu</span><span id="coursePlace">Centre culturel, Ettelbruck</span></div>
          <div><span class="ico person">Formateur</span><span id="courseTrainer">Laura Müller</span></div>
        </div>
        <div class="qr-block">
          <div class="qr-box"><img id="qrImage" alt="QR code"></div>
          <div class="arrow">↗</div>
          <div class="scan">Scannez-moi !</div>
        </div>
      </div>
    </div>

    <button id="printBtn" class="printbar" type="button">
      <span class="small-printer"></span>
      <span id="printLabel">Appuyez sur le bouton pour imprimer le flyer de ce cours</span>
      <span class="printer-circle">P</span>
    </button>
    <div id="printStatus" class="toast" role="status"></div>
  </section>
</main>
<div class="demo-nav"><span></span><a href="admin.html">Dashboard admin</a></div>
<script src="assets/config.js"></script>
<script src="assets/storage.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
