<!doctype html><html lang="de"><head><meta charset="utf-8"><title>UniPop System Check</title>
<style>body{font-family:Arial;background:#f5f6f8;padding:30px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px;margin-bottom:14px}.ok{color:#198754}.bad{color:#c0392b}.wait{color:#777}</style></head>
<body><h1>UniPop System Check</h1>
<div class="card"><b>trainings.json</b><div id="json" class="wait">Teste…</div></div>
<div class="card"><b>Supabase / Fallback</b><div id="sb" class="wait">Teste…</div></div>
<div class="card"><b>Local Storage</b><div id="ls" class="wait">Teste…</div></div>
<script src="assets/js/config.js"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/store.js"></script><script src="assets/js/supabase.js"></script><script src="assets/js/hybrid-store.js"></script><script src="assets/js/data.js"></script>
<script>(async()=>{const $=id=>document.getElementById(id);
try{const c=await UniData.loadCourses();$('json').className='ok';$('json').textContent='OK – '+c.length+' UniPop-Kurse geladen'}catch(e){$('json').className='bad';$('json').textContent='FEHLER – '+e.message}
try{const ds=await UniHybrid.getDisplays(UNIPOP_CONFIG.screens);$('sb').className='ok';$('sb').textContent='OK – '+ds.length+' Standorte verfügbar'}catch(e){$('sb').className='bad';$('sb').textContent='FEHLER – '+e.message}
try{localStorage.setItem('unipop_test','ok');const ok=localStorage.getItem('unipop_test')==='ok';localStorage.removeItem('unipop_test');$('ls').className=ok?'ok':'bad';$('ls').textContent=ok?'OK':'FEHLER'}catch(e){$('ls').className='bad';$('ls').textContent='FEHLER – '+e.message}})();</script>
</body></html>
